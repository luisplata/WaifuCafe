<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #231F20; }
    #unity-container { position: absolute; width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #231F20; }
    #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; text-align: center; color: #ccc; font-family: Arial, sans-serif; }
    #unity-progress-bar-empty { width: 141px; height: 8px; margin: 10px auto 0; background: #444; border-radius: 4px; overflow: hidden; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #ff9ad5; }
    #unity-fullscreen-button { position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; cursor: pointer; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; color: #fff; font-size: 20px; line-height: 40px; text-align: center; user-select: none; }
    #unity-fullscreen-button:hover { background: rgba(255,255,255,0.3); }
    #unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); background: white; padding: 10px; display: none; z-index: 10; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}"></canvas>
    <div id="unity-loading-bar">
      <div>Loading…</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-fullscreen-button">⛶</div>
  </div>
  <script>
    function unityShowBanner(msg, type) {
      var banner = document.querySelector("#unity-warning");
      var div = document.createElement("div");
      div.innerHTML = msg;
      div.style = type === "error" ? "background:red;padding:10px;" : "background:yellow;padding:10px;";
      banner.appendChild(div);
      banner.style.display = "block";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: unityShowBanner,
      // matchWebGLToCanvasSize stays at its default (true):
      // Unity syncs the WebGL render target to the DOM canvas size,
      // so the game fills the iframe at any resolution.
    };

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
