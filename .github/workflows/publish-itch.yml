name: Publish to Itch (WebGL + Android)

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]   # opcional: descomentar para auto-build

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: bash .github/workflows/scripts/free_disk_space.sh

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildsPath: build
          versioning: None

      - name: Strip unneeded files
        shell: pwsh
        run: |
          Get-ChildItem -Path build/WebGL -Recurse -File |
            Where-Object { $_.Name -like '*DoNotShip*' -or $_.Name -like '*BackUpThisFolder*' } |
            Remove-Item -Force

      - name: Compress WebGL build
        shell: pwsh
        run: Compress-Archive -Path build/WebGL/* -DestinationPath WaifuCafe-webgl.zip -Force

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: WaifuCafe-webgl.zip
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: bash .github/workflows/scripts/free_disk_space.sh

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build
          versioning: None
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Normalize APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apk-out | Out-Null
          $apk = Get-ChildItem -Path build/Android -Filter *.apk -Recurse | Select-Object -First 1
          if (-not $apk) { throw 'No APK found in build/Android' }
          Copy-Item $apk.FullName apk-out/WaifuCafe.apk -Force

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: apk-out/WaifuCafe.apk
          retention-days: 1

  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: [build-webgl, build-android]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish WebGL to itch.io
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: webgl
          ITCH_USER: PeryLoth
          ITCH_GAME: maid-cafe-combo-manager
          PACKAGE: artifacts/webgl-build/WaifuCafe-webgl.zip

      - name: Publish Android to itch.io
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: android
          ITCH_USER: PeryLoth
          ITCH_GAME: maid-cafe-combo-manager
          PACKAGE: artifacts/android-build/WaifuCafe.apk