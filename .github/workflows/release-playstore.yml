name: Release PlayStore (Signed AAB)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch, minor or major'
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  validate:
    name: Validate & Compute Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Guard main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Releases are only allowed from main"
            exit 1
          fi

      - name: Compute next SemVer
        id: compute
        run: |
          set -euo pipefail
          LATEST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST" ]; then MAJOR=1; MINOR=0; PATCH=0
          else
            MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1/')
            MINOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\2/')
            PATCH=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\3/')
          fi
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Pre-check tag / release idempotency
        run: |
          set -euo pipefail
          TAG="${{ steps.compute.outputs.tag }}"
          if gh release view "$TAG" --json tagName --jq .tagName 2>/dev/null | grep -qx "$TAG"; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$TAG")" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG exists on a different commit"; exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: bash .github/workflows/scripts/free_disk_space.sh

      # Play es produccion: el build no puede llevar herramientas de desarrollo
      # ni telemetria. itch queda como QA y no pasa por este strip.
      - name: Strip dev-only packages
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/strip-dev-packages.py
          echo "--- manifest final ---"
          cat Packages/manifest.json

      - name: Preflight signing config
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          ALIAS_NAME: ${{ vars.ANDROID_KEYALIAS_NAME || 'waifucafe' }}
        run: |
          set -euo pipefail
          missing=0
          check() { if [ -z "${!1:-}" ]; then echo "::error::Falta configurar $2"; missing=1; fi; }
          check KS_B64    "secret ANDROID_KEYSTORE_BASE64"
          check KS_PASS   "secret ANDROID_KEYSTORE_PASS"
          check ALIAS_PASS "secret ANDROID_KEYALIAS_PASS"
          echo "Keystore alias: $ALIAS_NAME"
          if [ "$missing" -ne 0 ]; then
            echo "::error::La firma no puede continuar sin keystore y passwords."
            exit 1
          fi

      - name: Build Android AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidAppBundle
          buildName: WaifuCafe
          buildsPath: build
          versioning: Custom
          version: ${{ needs.validate.outputs.version }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: .github/release.keystore   # unity-builder escribe el keystore desde base64
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ vars.ANDROID_KEYALIAS_NAME || 'waifucafe' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      # Data Safety: Play escanea el binario. Si un SDK de telemetria vuelve a
      # entrar, la declaracion "no se recopilan datos" deja de ser cierta.
      - name: Verify no telemetry SDKs in the AAB
        shell: bash
        run: python3 .github/workflows/scripts/verify-aab-clean.py

      - name: Verify and stage AAB
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/Android/*.aab
          mkdir -p release
          cp build/Android/*.aab release/WaifuCafe-${{ needs.validate.outputs.version }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: release/WaifuCafe-${{ needs.validate.outputs.version }}.aab
          retention-days: 1

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-android]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify AAB
        run: ls -lh artifacts/android-aab/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::El release $TAG ya existe"; exit 1
          fi
          # Sin --target: el tag se crea sobre el HEAD de main, que es el commit
          # del run. GITHUB_TOKEN no puede crear un ref hacia otro commit (403).
          gh release create "$TAG" "artifacts/android-aab/WaifuCafe-$VERSION.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WaifuCafe $TAG" \
            --generate-notes