name: probe-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Variantes de creacion de release con GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R="${GITHUB_REPOSITORY}"
          echo "HEAD actual: $(gh api "repos/${R}/commits/main" --jq .sha)"

          echo "== A: sin target_commitish, non-draft, generate_notes =="
          gh api -X POST "repos/${R}/releases" \
            -f tag_name="probe-a-${GITHUB_RUN_ID}" -f name="probe-a" \
            -F generate_release_notes=true --jq '{id,tag_name,target_commitish}' 2>&1 || true

          echo "== B: target_commitish = commit viejo f309b71 =="
          gh api -X POST "repos/${R}/releases" \
            -f tag_name="probe-b-${GITHUB_RUN_ID}" -f name="probe-b" \
            -f target_commitish="f309b71838c1065b714c2bf4444ed3b0ad835908" \
            -F generate_release_notes=true --jq '{id,tag_name,target_commitish}' 2>&1 || true

          echo "== C: target_commitish = HEAD =="
          gh api -X POST "repos/${R}/releases" \
            -f tag_name="probe-c-${GITHUB_RUN_ID}" -f name="probe-c" \
            -f target_commitish="${GITHUB_SHA}" \
            -F generate_release_notes=true --jq '{id,tag_name,target_commitish}' 2>&1 || true
